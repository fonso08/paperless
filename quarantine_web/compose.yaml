services:
  paperless-quarantine:
    build: .
    container_name: paperless-quarantine
    restart: unless-stopped
    environment:
      PAPERLESS_URL: "http://paperless:8000"
      PAPERLESS_STATE_DIR: "/media/BlueDisc3/PAPERLESS/state"
      QUARANTINE_BIND: "0.0.0.0"
      QUARANTINE_PORT: "1889"
      QUARANTINE_SESSION_SECRET: "${QUARANTINE_SESSION_SECRET:?Sitzungsschlüssel fehlt in .env}"
    volumes:
      - /media/BlueDisc3/PAPERLESS/state:/media/BlueDisc3/PAPERLESS/state
    ports:
      - "0.0.0.0:1889:1889"
    networks:
      - bluenet

networks:
  bluenet:
    external: true
