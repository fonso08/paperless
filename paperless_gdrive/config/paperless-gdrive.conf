# ============================================================
# Paperless Google Drive Automation v7 - Konfiguration
# ============================================================
# Diese Datei enthält ausschließlich Konfiguration.
# Keine Zugangsdaten in Scripts eintragen.
#
# WICHTIG:
# - PAPERLESS_TOKEN wird absichtlich NICHT hier hinterlegt.
# - Die Umgebungsvariable PAPERLESS_TOKEN muss beim Aufruf gesetzt sein.
# ============================================================

# Basisverzeichnis der v7-Installation
BASE_DIR="/home/pi/docker/paperless/paperless_gdrive"

# Paperless-Datenbereich
PAPERLESS_DATA_DIR="/media/BlueDisc3/PAPERLESS"
SCANPOOL_DIR="${PAPERLESS_DATA_DIR}/scanpool"

# Externes Log-Verzeichnis
LOG_DIR="/media/BlueDisc3/PAPERLESS/logs"

# Job-State auf dem Systemdatenträger
STATE_DIR="${PAPERLESS_DATA_DIR}/state"
JOB_DIR="${STATE_DIR}/jobs"
TMP_DIR="${STATE_DIR}/tmp"
ACTIVE_JOB_FILE="${STATE_DIR}/active_job"

# Paperless API
PAPERLESS_URL="http://rasp2:1888"
PAPERLESS_API_VERSION="10"

# Google Drive / rclone
RCLONE_REMOTE="gdrive:"
GDRIVE_SCAN="${RCLONE_REMOTE}SCAN"
GDRIVE_ARCHIVE="${RCLONE_REMOTE}PAPERLESS"

# Nach erfolgreicher Archivierung bzw. bestätigtem Duplikat löschen?
DELETE_SOURCE_AFTER_VERIFY=true

# Archivdateiname:
# true  = Job-ID an Dateinamen anhängen
# false = Originaldateiname verwenden
ARCHIVE_ADD_JOB_ID=true

# Warte-/Timeout-Werte für API-Abfragen
PAPERLESS_POLL_INTERVAL=10
PAPERLESS_TASK_TIMEOUT=86400

# Maximale Anzahl Dateien pro Lauf von Script 01.
# 0 = keine Begrenzung.
: "${GDRIVE_MAX_FILES_PER_RUN:=0}"

# ============================================================
# Kategorie-Priorität
# Die Reihenfolge ist bewusst fest definiert. Bei mehreren
# passenden Tags gewinnt der erste Eintrag.
# Format: PAPERLESS_TAG__<tagname>=<archivordner>
# ============================================================
PAPERLESS_TAG__gdrive_haus="Haus"
PAPERLESS_TAG__gdrive_aerzte="Ärzte"
PAPERLESS_TAG__gdrive_versicherungen="Versicherungen"
PAPERLESS_TAG__gdrive_finanzen="Finanzen"
PAPERLESS_TAG__gdrive_vertraege="Verträge"
PAPERLESS_DEFAULT_CATEGORY="unsortiert"
